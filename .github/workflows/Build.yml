name: OBody TMV VR test build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [src/UI/UI.cpp, .github/workflows/Build.yml]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup C++ environment on remote runner
        uses: aminya/setup-cpp@v1
        with:
          compiler: msvc
          vcvarsall: true
          setup-cpp: false
          powershell: true
      - name: Setup upstream vcpkg baseline
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 980c981a8ab8dcf9389c9d10c3e1bc20b6ee23f9
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.0.0'
      - name: Verify source and dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($dir in @('lib/commonlibsse-ng', 'lib/skse-menu-framework-api')) {
            if (-not (Get-ChildItem -LiteralPath $dir -File -Recurse | Select-Object -First 1)) {
              throw "Missing submodule: $dir. Use a GitHub fork, not a ZIP-only repository."
            }
          }
          if (-not (Select-String -LiteralPath 'xmake.lua' -SimpleMatch 'set_version("5.3.1")' -Quiet)) {
            throw 'This experimental patch targets OBody 5.3.1.'
          }
          git rev-parse HEAD | Set-Content build-source.txt
          git submodule status --recursive | Add-Content build-source.txt
      - name: Build OBody on remote runner
        shell: pwsh
        run: xmake -y OBody
      - name: Package DLL-only MO2 override
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = @(Get-ChildItem build -Recurse -File -Filter OBody.dll)
          if ($dll.Count -ne 1) { throw "Expected one OBody.dll, found $($dll.Count)" }
          New-Item -ItemType Directory -Force package/SKSE/Plugins | Out-Null
          Copy-Item -LiteralPath $dll[0].FullName -Destination package/SKSE/Plugins/OBody.dll
          Get-ChildItem build -Recurse -File -Filter OBody.pdb | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination package/SKSE/Plugins/OBody.pdb
          }
          Copy-Item LICENSE package/LICENSE-OBody.txt
          Copy-Item build-source.txt package/build-source.txt
          Get-FileHash package/SKSE/Plugins/OBody.dll -Algorithm SHA256 |
            Format-List | Out-String | Set-Content package/dll-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OBody-5.3.1-TMV-VR-test1
          path: package/
          if-no-files-found: error
          retention-days: 30
